[package]
name = "bot8trade-rs"
version = "0.1.0"
edition = "2021"
authors = ["stanleytarus022-cyber"]
license = "GPL-3.0"
description = "A gold prediction bot with MetaTrader5 integration"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["shell-open"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
rand = "0.8"
env_logger = "0.10"
log = "0.4"
# Machine Learning
ndarray = "0.15"
linfa = "0.7"
linfa-clustering = "0.7"
# Technical Analysis
tlc = "0.3"
# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
# API Clients
api-types = "0.1"
# Cryptography
sha2 = "0.10"
# WebSocket for real-time data
tungstenite = "0.20"
tokio-tungstenite = "0.20"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
