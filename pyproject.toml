[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bot8trade-py"
version = "0.1.0"
description = "Python utilities and scripts for Bot8trade-rs"
authors = ["stanleytarus022-cyber"]
license = "GPL-3.0"

[tool.poetry.dependencies]
python = "^3.9"
mt5-interface = "^1.0"
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.3"
tensorflow = "^2.13"
nltk = "^3.8"
requests = "^2.31"
aiohttp = "^3.9"
python-dotenv = "^1.0"
logging-loki = "^0.3"
